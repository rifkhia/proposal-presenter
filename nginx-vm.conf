# HTTPS for proposal-presenter on the VM's host nginx.
#
#   cp nginx-vm.conf /etc/nginx/conf.d/proposal-presenter.conf
#   nginx -t && systemctl reload nginx
#
# TLS ends here; the app container is only published on 127.0.0.1:8080
# (APP_PORT=127.0.0.1:8080 in .env), so HTTPS is the only way in.
# Certificate and key: see README, "HTTPS".
#
# Port 80 for this hostname belongs to simple-placement-providers
# (conf.d/placement-providers.conf) and is not touched here.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vmw4-raprustandi.cdt.spb.openwaygroup.com;

    ssl_certificate     /etc/pki/nginx/vmw4-raprustandi.crt;
    ssl_certificate_key /etc/pki/nginx/private/vmw4-raprustandi.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Add once the certificate is signed by the OpenWay Group CA. Not before:
    # with HSTS, browsers refuse to let anyone click through a self-signed warning.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 5m; # saving a proposal sends the whole file

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
